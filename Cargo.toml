[package]
name = "harborgate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust HarborGate IM transport gateway for HarborBeacon"

[lib]
name = "harborgate"
path = "src/lib.rs"

[[bin]]
name = "harboros-im-gate"
path = "src/bin/harborgate.rs"

[dependencies]
anyhow = "1"
aes = "0.8"
async-trait = "0.1"
aws-credential-types = "=1.3.0"
aws-sigv4 = { version = "=1.5.1", default-features = false, features = ["sign-http", "http1"] }
atomicwrites = "=0.4.4"
axum = "0.8"
base64 = "0.22"
bytes = "1"
cap-primitives = "=4.0.2"
cap-std = "=4.0.2"
chrono = { version = "0.4", features = ["serde"] }
constant_time_eq = "=0.3.1"
ecb = { version = "0.1", features = ["alloc"] }
futures-util = "0.3"
fs2 = "0.4"
hmac = "0.12"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
md5 = "0.7"
mime_guess = "2"
prost = "0.13"
qrcodegen = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
